<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Spruce: three stacked glass chevrons — a spruce tree that also reads as "speed up". macOS icon grid: 824 pt body, 100 pt margin. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A6B58"/>
      <stop offset="0.55" stop-color="#0D3F35"/>
      <stop offset="1" stop-color="#05201B"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#7DF5D0" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#2DD4A0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2DD4A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2FFFA"/><stop offset="1" stop-color="#A7F7DD"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B4F8E2"/><stop offset="1" stop-color="#4FE0B2"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FEBC4"/><stop offset="1" stop-color="#1FB98C"/></linearGradient>
    <radialGradient id="glint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#E6FFF6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7DF5D0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="chevronShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#021411" flood-opacity="0.55"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185" ry="185"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#light)"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#chevronShadow)">
      <path d="M254 790 L512 574 L770 790" stroke="url(#c3)" stroke-width="70"/>
      <path d="M307 604 L512 432 L717 604" stroke="url(#c2)" stroke-width="70"/>
      <path d="M362 418 L512 292 L662 418" stroke="url(#c1)" stroke-width="70"/>
    </g>
    <!-- glass highlights along the top edge of each chevron -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="12" opacity="0.55">
      <path d="M268 770 L512 565 L756 770"/>
      <path d="M321 584 L512 423 L703 584"/>
      <path d="M376 398 L512 283 L648 398"/>
    </g>
    <circle cx="512" cy="196" r="60" fill="url(#glint)"/>
    <circle cx="512" cy="196" r="17" fill="#FFFFFF"/>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="182" ry="182" fill="none" stroke="url(#rim)" stroke-width="6"/>
</svg>
