<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Root app icon: the root shell's "#" and a cursor, lit lime on near-black. Layers for Icon
       Composer are in IconLayers/ (background, hash, cursor). See docs/DESIGN.md. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18221A"/>
      <stop offset="1" stop-color="#070A08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#84CC16" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#84CC16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lime" gradientUnits="userSpaceOnUse" x1="212" y1="250" x2="704" y2="770">
      <stop offset="0" stop-color="#ECFCCB"/>
      <stop offset="0.45" stop-color="#A3E635"/>
      <stop offset="1" stop-color="#4D7C0F"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <g transform="translate(100 100) scale(0.8047)">
    <rect width="1024" height="1024" rx="232" fill="url(#bg)" filter="url(#shadow)"/>
    <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>
    <rect x="6" y="6" width="1012" height="1012" rx="228" fill="none" stroke="url(#rim)" stroke-width="10"/>
    <g fill="none" stroke="#A3E635" stroke-width="76" stroke-linecap="round" opacity="0.55" filter="url(#bloom)">
      <path d="M400 250 L340 770"/><path d="M600 250 L540 770"/><path d="M236 420 L704 420"/><path d="M212 610 L680 610"/>
    </g>
    <g fill="none" stroke="url(#lime)" stroke-width="76" stroke-linecap="round">
      <path d="M400 250 L340 770"/><path d="M600 250 L540 770"/><path d="M236 420 L704 420"/><path d="M212 610 L680 610"/>
    </g>
    <rect x="732" y="704" width="124" height="54" rx="14" fill="#A3E635"/>
  </g>
</svg>
