<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Spruce: four rounded bars stacked into a spruce tree; they also read as disk-usage bars.
       macOS icon grid: 824 pt body, 100 pt margin. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17463A"/><stop offset="1" stop-color="#06170F"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6"><stop offset="0" stop-color="#5FF0C4" stop-opacity="0.4"/><stop offset="1" stop-color="#5FF0C4" stop-opacity="0"/></radialGradient>
    <linearGradient id="b0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2FFFA"/><stop offset="1" stop-color="#BDF6E2"/></linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BF2D5"/><stop offset="1" stop-color="#5FE0B6"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#49D9AB"/><stop offset="1" stop-color="#22B98C"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1DAE85"/><stop offset="1" stop-color="#0E7F62"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity="0.33"/></filter>
    <filter id="barShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/></filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <g filter="url(#barShadow)">
      <rect x="414" y="262" width="196" height="100" rx="50" fill="url(#b0)"/>
      <rect x="340" y="386" width="344" height="100" rx="50" fill="url(#b1)"/>
      <rect x="266" y="510" width="492" height="100" rx="50" fill="url(#b2)"/>
      <rect x="192" y="634" width="640" height="100" rx="50" fill="url(#b3)"/>
    </g>
    <!-- glass highlight along the top of each bar -->
    <g fill="#FFFFFF" opacity="0.35">
      <rect x="440" y="274" width="144" height="16" rx="8"/>
      <rect x="366" y="398" width="292" height="16" rx="8"/>
      <rect x="292" y="522" width="440" height="16" rx="8"/>
      <rect x="218" y="646" width="588" height="16" rx="8"/>
    </g>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="url(#rim)" stroke-width="6"/>
</svg>
