<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="100%">
      <stop offset="0" stop-color="#2E3D5C"/>
      <stop offset="0.5" stop-color="#151C2C"/>
      <stop offset="1" stop-color="#080B12"/>
    </radialGradient>
    <pattern id="brushed" width="1024" height="6" patternUnits="userSpaceOnUse">
      <rect width="1024" height="1" y="0" fill="#FFFFFF" opacity="0.03"/>
      <rect width="1024" height="1" y="3" fill="#000000" opacity="0.06"/>
    </pattern>
    <linearGradient id="reflection" gradientUnits="userSpaceOnUse" x1="180" y1="120" x2="900" y2="900">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.30" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#9FD8FF" stop-opacity="0.10"/>
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="polish" gradientUnits="userSpaceOnUse" x1="220" y1="700" x2="800" y2="300">
      <stop offset="0" stop-color="#2FD4B5"/>
      <stop offset="0.55" stop-color="#2F8CFF"/>
      <stop offset="1" stop-color="#8A6CFF"/>
    </linearGradient>
    <linearGradient id="specular" gradientUnits="userSpaceOnUse" x1="0" y1="430" x2="0" y2="860">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <!-- The swoosh: a tapered polishing stroke, thick in the middle, pointed at both ends. -->
    <path id="swoosh" d="M214,604 Q452,790 806,300 Q520,1000 214,604 Z"/>
  </defs>
  <!-- Glint: the shine the polish leaves behind -->
  <g filter="url(#bloom)" transform="translate(770 270)">
    <path d="M0,-132 C9,-34 34,-9 132,0 C34,9 9,34 0,132 C-9,34 -34,9 -132,0 C-34,-9 -9,-34 0,-132 Z" fill="#FFFFFF"/>
  </g>
  <g filter="url(#bloom)" transform="translate(640 196)" opacity="0.9">
    <path d="M0,-40 C3,-10 10,-3 40,0 C10,3 3,10 0,40 C-3,10 -10,3 -40,0 C-10,-3 -3,-10 0,-40 Z" fill="#FFFFFF"/>
  </g>
</svg>
