name: CI

on:
  push:
  pull_request:
  # "Run workflow" on the Actions tab: e.g. a fresh signed build after adding the signing secrets.
  workflow_dispatch:

jobs:
  macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      # The signing certificate (scripts/make-signing-identity.sh). Absent → ad-hoc signing.
      ROOT_SIGNING_P12: ${{ secrets.ROOT_SIGNING_P12 }}
      ROOT_SIGNING_PASSWORD: ${{ secrets.ROOT_SIGNING_PASSWORD }}
      # Developer ID + notarization (scripts/make-developer-id.sh). When present, these win: the app
      # is signed with the Developer ID, notarized by Apple and stapled, so it opens with no warning.
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 27 Golden Gate with the 27.2 SDK. GitHub labels this image "xcode-27" (preview).
          # This build is the one to install on Macs running macOS 27.
          - name: macOS 27 · Xcode 27.2 SDK
            runner: xcode-27
            xcode: "27.2"
            artifact: Spruce
          # Current GA image (macOS 26 Tahoe), so the app keeps building for Sonoma through Tahoe.
          - name: macOS 26 · newest Xcode
            runner: macos-latest
            xcode: ""
            artifact: Spruce-built-on-macOS-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          XCODE=""
          if [ -n "${{ matrix.xcode }}" ]; then
            XCODE="$(ls -d "/Applications/Xcode_${{ matrix.xcode }}.app" 2>/dev/null | head -1)"
          fi
          [ -n "$XCODE" ] || XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build (debug, all products incl. SwiftUI app)
        run: swift build
      - name: Test
        run: swift test
      - name: Signing identity
        if: env.DEVELOPER_ID_P12 != '' || env.ROOT_SIGNING_P12 != ''
        run: |
          if [ -n "$DEVELOPER_ID_P12" ]; then
            echo "Using the Developer ID certificate"
            echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/root-signing.p12"
            scripts/import-signing-identity.sh "$RUNNER_TEMP/root-signing.p12" "$DEVELOPER_ID_PASSWORD"
            echo "ROOT_SIGN_TIMESTAMP=1" >> "$GITHUB_ENV"
            echo "ROOT_DEVELOPER_ID=1" >> "$GITHUB_ENV"
          else
            echo "Using the Root Signing certificate"
            echo "$ROOT_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/root-signing.p12"
            scripts/import-signing-identity.sh "$RUNNER_TEMP/root-signing.p12" "$ROOT_SIGNING_PASSWORD"
          fi
          rm -f "$RUNNER_TEMP/root-signing.p12"
      - name: Package app bundle
        run: scripts/build-app.sh
      - name: Notarize
        # Apple scans the app and issues a ticket; stapling it means Gatekeeper accepts the app on
        # any Mac, offline too, with no "Open Anyway". Rebuilds dist/Spruce.zip from the stapled app.
        if: env.ROOT_DEVELOPER_ID == '1' && env.NOTARY_APPLE_ID != ''
        timeout-minutes: 35
        run: scripts/notarize.sh dist/Spruce.app
      - name: Signing self-test (permissions survive updates)
        # With a throwaway certificate made by the same script you run: two different builds must
        # get different code hashes but the same designated requirement, which is what macOS
        # privacy permissions are tied to.
        run: |
          T="$RUNNER_TEMP/sigtest"
          scripts/make-signing-identity.sh --ci "$T"
          eval "$(GITHUB_ENV= scripts/import-signing-identity.sh "$T/root-signing.p12" "$(cat "$T/password")" | tail -1)"
          for v in 1 2; do
            rm -rf "$T/v$v.app"; cp -R dist/Spruce.app "$T/v$v.app"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 9$v" "$T/v$v.app/Contents/Info.plist"
            codesign --force --timestamp=none --keychain "$ROOT_SIGN_KEYCHAIN" --sign "$ROOT_SIGN_IDENTITY" "$T/v$v.app"
            codesign --verify --strict "$T/v$v.app"
          done
          dr1="$(codesign -d -r- "$T/v1.app" 2>&1 | grep '^designated')"
          dr2="$(codesign -d -r- "$T/v2.app" 2>&1 | grep '^designated')"
          h1="$(codesign -dvvv "$T/v1.app" 2>&1 | grep '^CDHash=')"
          h2="$(codesign -dvvv "$T/v2.app" 2>&1 | grep '^CDHash=')"
          echo "$dr1"; echo "v1 $h1"; echo "v2 $h2"
          [[ "$dr1" == "$dr2" && "$dr1" == *"certificate leaf"* && "$h1" != "$h2" ]] \
            && echo "OK: different builds, same identity to macOS" \
            || { echo "Signing self-test failed"; exit 1; }
      - name: CLI smoke test
        run: |
          dist/Spruce.app/Contents/Helpers/spruce --version
          dist/Spruce.app/Contents/Helpers/spruce doctor
          dist/Spruce.app/Contents/Helpers/spruce scan
          dist/Spruce.app/Contents/Helpers/spruce optimize --list
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/Spruce.zip
      - name: Screenshot tour
        # Launches the real app, which runs a scan and steps through every page; each page is
        # captured here. JPEGs are printed between @@SHOT/@@END markers so they can be read back
        # from the job log, and uploaded as an artifact.
        timeout-minutes: 12
        continue-on-error: true
        run: |
          mkdir -p shots
          SPRUCE_TOUR="$PWD/shots" dist/Spruce.app/Contents/MacOS/Spruce > shots/app.log 2>&1 &
          APP=$!
          for _ in $(seq 1 1200); do
            for ready in shots/*.ready; do
              [ -e "$ready" ] || continue
              base="${ready%.ready}"
              screencapture -x "$base.png" || echo "screencapture failed for $base"
              mv "$ready" "$base.done"
            done
            # The app closed its window: "click the Dock icon". Opening a running app sends the same
            # reopen event the Dock does.
            if [ -e shots/closed ] && [ ! -e shots/reopen-sent ]; then
              touch shots/reopen-sent
              cat shots/closed
              open "$PWD/dist/Spruce.app"
            fi
            [ -e shots/finished ] && break
            kill -0 $APP 2>/dev/null || { echo "app exited early"; cat shots/app.log; break; }
            sleep 0.5
          done
          kill $APP 2>/dev/null || true
          echo "in-process AppleScript on a background queue: $(cat shots/applescript.txt 2>/dev/null || echo 'not run')"
          echo "menu bar panel: $(cat shots/panel.txt 2>/dev/null || echo 'not shown')"
          echo "reopen event received: $([ -e shots/reopen-event ] && echo yes || echo no)"
          cat shots/reopen-result 2>/dev/null || echo "REOPEN FAILED: no result written"
          echo "Spruce processes still running: $(pgrep -f 'Spruce.app/Contents/MacOS/Spruce' | wc -l | tr -d ' ')"
          pkill -f 'Spruce.app/Contents/MacOS/Spruce' || true
          for png in shots/*.png; do
            [ -e "$png" ] || continue
            jpg="${png%.png}.jpg"
            sips -Z 1600 -s format jpeg -s formatOptions 70 "$png" --out "$jpg" >/dev/null
            echo "@@SHOT $(basename "${png%.png}")"
            base64 -b 160 -i "$jpg"
            echo "@@END"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots-${{ matrix.artifact }}
          path: shots/*.jpg
          if-no-files-found: ignore

  linux:
    name: Linux — engine and CLI tests
    runs-on: ubuntu-24.04
    # Swift's official image: setup-swift has to fetch signing keys from keyserver.ubuntu.com on
    # every run, and fails the job whenever that server is down.
    container: swift:6.2-noble
    env:
      SPRUCE_ALLOW_ROOT: "1"   # containers run as root; Spruce refuses root unless told
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
