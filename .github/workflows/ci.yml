name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 27 Golden Gate with the 27.2 SDK. GitHub labels this image "xcode-27" (preview).
          # This build is the one to install on Macs running macOS 27.
          - name: macOS 27 · Xcode 27.2 SDK
            runner: xcode-27
            xcode: "27.2"
            artifact: Root
          # Current GA image (macOS 26 Tahoe), so the app keeps building for Sonoma through Tahoe.
          - name: macOS 26 · newest Xcode
            runner: macos-latest
            xcode: ""
            artifact: Root-built-on-macOS-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          XCODE=""
          if [ -n "${{ matrix.xcode }}" ]; then
            XCODE="$(ls -d "/Applications/Xcode_${{ matrix.xcode }}.app" 2>/dev/null | head -1)"
          fi
          [ -n "$XCODE" ] || XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build (debug, all products incl. SwiftUI app)
        run: swift build
      - name: Test
        run: swift test
      - name: Package app bundle
        run: scripts/build-app.sh
      - name: CLI smoke test
        run: |
          dist/Root.app/Contents/Helpers/root --version
          dist/Root.app/Contents/Helpers/root doctor
          dist/Root.app/Contents/Helpers/root scan
          dist/Root.app/Contents/Helpers/root optimize --list
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/Root.zip
      - name: Screenshot tour
        # Launches the real app, which runs a scan and steps through every page; each page is
        # captured here. JPEGs are printed between @@SHOT/@@END markers so they can be read back
        # from the job log, and uploaded as an artifact.
        timeout-minutes: 12
        continue-on-error: true
        run: |
          mkdir -p shots
          ROOTAPP_TOUR="$PWD/shots" dist/Root.app/Contents/MacOS/Root > shots/app.log 2>&1 &
          APP=$!
          for _ in $(seq 1 1200); do
            for ready in shots/*.ready; do
              [ -e "$ready" ] || continue
              base="${ready%.ready}"
              screencapture -x "$base.png" || echo "screencapture failed for $base"
              mv "$ready" "$base.done"
            done
            [ -e shots/finished ] && break
            kill -0 $APP 2>/dev/null || { echo "app exited early"; cat shots/app.log; break; }
            sleep 0.5
          done
          kill $APP 2>/dev/null || true
          for png in shots/*.png; do
            [ -e "$png" ] || continue
            jpg="${png%.png}.jpg"
            sips -Z 1600 -s format jpeg -s formatOptions 70 "$png" --out "$jpg" >/dev/null
            echo "@@SHOT $(basename "${png%.png}")"
            base64 -b 160 -i "$jpg"
            echo "@@END"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots-${{ matrix.artifact }}
          path: shots/*.jpg
          if-no-files-found: ignore

  linux:
    name: Linux — engine and CLI tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - run: swift build
      - run: swift test
